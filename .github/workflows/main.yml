name: HKJC Race Results Scraper

on:
  schedule:
    # 每週二及週四香港時間 23:30 執行 (UTC 15:30)
    # 賽事通常在晚上結束，此時數據最完整
    - cron: '30 15 * * 2,4'
  workflow_dispatch: # 允許手動觸發

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hkjc-main-branch-write
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4
        playwright install chromium
        playwright install-deps chromium

    - name: Run scraper
      run: python hkjc_scraper_github.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*
        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "Auto-update race results: $(date +'%Y-%m-%d')"

        for attempt in 1 2 3; do
          git fetch origin main
          git rebase origin/main
          if git push origin HEAD:main; then
            echo "Push succeeded on attempt ${attempt}."
            exit 0
          fi
          echo "Push failed on attempt ${attempt}; retrying..."
        done

        echo "Push failed after 3 attempts."
        exit 1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
